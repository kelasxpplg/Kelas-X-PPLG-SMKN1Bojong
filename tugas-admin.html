<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Tugas (Admin)</title>
<link rel="stylesheet" href="styler.css">
<style>
  .admin-wrap { max-width: 600px; margin: 40px auto; padding: 0 20px; }
  .card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 4px; }
  input, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
  }
  button:hover { background: #1d4ed8; }
  .tugas-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    gap: 10px;
  }
  .tugas-item:last-child { border-bottom: none; }
  .tugas-info { font-size: 14px; }
  .tugas-info b { display: block; margin-bottom: 2px; }
  .btn-hapus {
    background: #dc2626;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    width: auto;
    white-space: nowrap;
  }
  .btn-hapus:hover { background: #b91c1c; }
  .error { color: #dc2626; font-size: 13px; margin-top: -8px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="admin-wrap">
  <h1>⚙️ Kelola Tugas</h1>

  <div class="card">
    <form id="form-tugas">
      <label>Mata Pelajaran</label>
      <input type="text" id="mapel" placeholder="Contoh: Matematika" required>

      <label>Deskripsi Tugas</label>
      <textarea id="deskripsi" rows="3" placeholder="Contoh: Kerjakan LKS halaman 20" required></textarea>

      <label>Deadline</label>
      <input type="date" id="deadline" required>

      <div class="error" id="error-msg"></div>
      <button type="submit">Tambah Tugas</button>
    </form>
  </div>

  <div class="card">
    <h3>Semua Tugas</h3>
    <div id="daftar-admin">Memuat...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const db = firebase.firestore();
const form = document.getElementById('form-tugas');
const errorMsg = document.getElementById('error-msg');
const daftarEl = document.getElementById('daftar-admin');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';

  const mapel = document.getElementById('mapel').value.trim();
  const deskripsi = document.getElementById('deskripsi').value.trim();
  const deadline = document.getElementById('deadline').value;

  if (!mapel || !deskripsi || !deadline) {
    errorMsg.textContent = 'Semua field wajib diisi';
    return;
  }

  try {
    await db.collection('tugas').add({
      mapel, deskripsi, deadline,
      dibuat_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    form.reset();
  } catch (err) {
    errorMsg.textContent = 'Gagal menyimpan: ' + err.message;
  }
});

db.collection('tugas').orderBy('deadline', 'asc').onSnapshot((snapshot) => {
  if (snapshot.empty) {
    daftarEl.innerHTML = '<p style="color:#888;">Belum ada tugas.</p>';
    return;
  }

  daftarEl.innerHTML = '';
  snapshot.forEach((doc) => {
    const t = doc.data();
    const item = document.createElement('div');
    item.className = 'tugas-item';
    item.innerHTML = `
      <div class="tugas-info">
        <b>${t.mapel}</b>
        ${t.deskripsi}<br>
        <span style="color:#888;">Deadline: ${t.deadline}</span>
      </div>
      <button class="btn-hapus">Hapus</button>
    `;
    item.querySelector('.btn-hapus').addEventListener('click', async () => {
      if (confirm(`Hapus tugas "${t.mapel}"?`)) {
        await db.collection('tugas').doc(doc.id).delete();
      }
    });
    daftarEl.appendChild(item);
  });
});
</script>

</body>
</html>
