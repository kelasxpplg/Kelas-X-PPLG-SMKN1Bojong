<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Tugas — Kelas X PPLG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styler.css">
<link rel="stylesheet" href="tambahan.css">
<style>
  .sticky-note.tugas-note { min-height: 160px; display: flex; flex-direction: column; }
  .tugas-mapel { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  .tugas-deskripsi { font-size: 0.9rem; flex-grow: 1; margin-bottom: 8px; }
  .tugas-deadline { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; opacity: 0.8; }
  .note-mendesak { background: #f2b5ab; }
  .kosong-tugas {
    font-family: var(--font-mono);
    text-align: center;
    color: #5a5748;
    padding: 40px 0;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand-group">
      <img src="logosmk.png" alt="Logo SMKN 1 Bojong" class="logo" onerror="this.style.display='none'">
      <span class="brand"></span>
    </div>
    <nav class="nav">
      <a href="index.html#tentang">Tentang</a>
      <a href="index.html#jadwal">Jadwal</a>
      <a href="index.html#pengurus">Pengurus</a>
      <a href="daftar-siswa.html">Daftar Siswa</a>
      <a href="galeri.html">Galeri</a>
      <a href="tugas.html">Tugas</a>
      <a href="index.html#pengumuman">Pengumuman</a>
      <a href="index.html#kontak">Kontak</a>
      <a href="profil.html">Profil</a>
    </nav>
  </div>
</header>

<section class="section paper-bg">
  <div class="wrap">
    <h2 class="section-title">📋 Daftar Tugas</h2>
    <p class="section-sub">Semua tugas yang deadline-nya masih berlaku, diurutkan dari yang paling dekat.</p>
    <div class="sticky-grid" id="daftar-tugas">Memuat...</div>
  </div>
</section>

<footer id="kontak" class="footer">
  <div class="wrap footer-inner">
    <div>
      <h2 class="footer-title">Hubungi Kami</h2>
      <p>Wali Kelas: Bu Ria</p>
      <p class="footer-note">SMKN 1 Bojong · Kelas X PPLG · Tahun Ajaran 2025/2026</p>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const db = firebase.firestore();
const daftarEl = document.getElementById('daftar-tugas');

function parseTanggal(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatTanggal(str) {
  return parseTanggal(str).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

db.collection('tugas').orderBy('deadline', 'asc').onSnapshot((snapshot) => {
  const sekarang = new Date();
  sekarang.setHours(0, 0, 0, 0);

  const aktif = [];
  snapshot.forEach((doc) => {
    const data = doc.data();
    if (parseTanggal(data.deadline) >= sekarang) {
      aktif.push(data);
    }
  });

  if (aktif.length === 0) {
    daftarEl.innerHTML = '<p class="kosong-tugas">Gak ada tugas yang deadline-nya masih berlaku. Aman! 🎉</p>';
    return;
  }

  daftarEl.innerHTML = aktif.map(t => {
    const selisihHari = Math.ceil((parseTanggal(t.deadline) - sekarang) / (1000 * 60 * 60 * 24));
    const warnaKelas = selisihHari <= 1 ? 'note-mendesak' : 'note-yellow';
    return `
      <div class="sticky-note tugas-note ${warnaKelas}">
        <p class="tugas-mapel">${t.mapel}</p>
        <p class="tugas-deskripsi">${t.deskripsi}</p>
        <p class="tugas-deadline">📅 ${formatTanggal(t.deadline)}</p>
      </div>
    `;
  }).join('');
});
</script>

</body>
</html>
